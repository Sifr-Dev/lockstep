name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Vet packages
        run: go vet ./...

      - name: Run unit and integration tests
        run: go test -shuffle=on -count=1 ./...

      - name: Run race-enabled tests
        run: go test -race -count=1 ./...

      - name: Build packages
        run: go build ./...
